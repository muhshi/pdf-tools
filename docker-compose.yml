services:
  pdf-tools:
    image: stirlingtools/stirling-pdf:latest
    container_name: pdf-tools
    ports:
      - "${PORT:-8880}:8080"
    env_file:
      - .env
    environment:
      # Keamanan Login
      - SECURITY_ENABLELOGIN=${SECURITY_ENABLELOGIN:-true}
      - SECURITY_LOGINMETHOD=${SECURITY_LOGINMETHOD:-all}
      - SECURITY_INITIALLOGIN_USERNAME=${ADMIN_USERNAME:-admin}
      - SECURITY_INITIALLOGIN_PASSWORD=${ADMIN_PASSWORD:-StirlingPassword123!}
      
      # Integrasi SSO Sipetra (OAuth2 Standar Spring Security)
      - SECURITY_OAUTH2_ENABLED=${SECURITY_OAUTH2_ENABLED:-true}
      - SECURITY_OAUTH2_AUTOCREATEUSER=${SECURITY_OAUTH2_AUTOCREATEUSER:-true}
      - SECURITY_OAUTH2_BLOCKREGISTRATION=${SECURITY_OAUTH2_BLOCKREGISTRATION:-false}

      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SIPETRA_CLIENT_ID=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SIPETRA_CLIENT_ID:-019fca70-defd-73c4-b5d5-f2ac581a0792}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SIPETRA_CLIENT_SECRET=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SIPETRA_CLIENT_SECRET:-Efg9peKx0CFqxC9SgvZI5hqNMdyOgV8MktRo9bSw}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SIPETRA_AUTHORIZATION_GRANT_TYPE=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SIPETRA_AUTHORIZATION_GRANT_TYPE:-authorization_code}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SIPETRA_REDIRECT_URI=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SIPETRA_REDIRECT_URI:-{baseUrl}/auth/sipetra/callback}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SIPETRA_SCOPE=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SIPETRA_SCOPE:-identity_pegawai:read, employee:read, contact:read, roles:read}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SIPETRA_PROVIDER=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SIPETRA_PROVIDER:-sipetra}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SIPETRA_CLIENT_NAME=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SIPETRA_CLIENT_NAME:-Sipetra SSO}

      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SIPETRA_AUTHORIZATION_URI=${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SIPETRA_AUTHORIZATION_URI:-https://bpsdemak.com/oauth/authorize}
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SIPETRA_TOKEN_URI=${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SIPETRA_TOKEN_URI:-https://bpsdemak.com/oauth/token}
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SIPETRA_USER_INFO_URI=${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SIPETRA_USER_INFO_URI:-https://bpsdemak.com/api/user}
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SIPETRA_USER_NAME_ATTRIBUTE=${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SIPETRA_USER_NAME_ATTRIBUTE:-email}
      
      # Pengaturan Bahasa, Nama & Tema Aplikasi
      - SYSTEM_DEFAULTLOCALE=${LOCALE:-id_ID}
      - UI_APPNAME=${APP_NAME:-PDF Tools}
      - SYSTEM_DEFAULTTHEME=${SYSTEM_DEFAULTTHEME:-light}
      
      # Performa & Resource Tuning
      - JAVA_TOOL_OPTIONS=-Xmx1024m
    volumes:
      - ./trainingData:/usr/share/tessdata
      - ./extraConfigs:/configs
      - ./customFiles:/customFiles
      - ./pipeline:/pipeline
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
