services:
  pdf-tools:
    build:
      context: .
      dockerfile: docker/embedded/Dockerfile
    image: pdf-tools:local
    container_name: pdf-tools
    ports:
      - "${PORT:-8880}:8080"
    env_file:
      - .env
    environment:
      # Keamanan Login
      - SECURITY_ENABLELOGIN=${SECURITY_ENABLELOGIN:-true}
      - SECURITY_LOGINMETHOD=${SECURITY_LOGINMETHOD:-all}
      - SECURITY_INITIALLOGIN_USERNAME=${ADMIN_USERNAME:-admin}
      - SECURITY_INITIALLOGIN_PASSWORD=${ADMIN_PASSWORD:-StirlingPassword123!}
      
      # Integrasi SSO Sipetra (OAuth2 Custom dengan Endpoint Eksplisit)
      - SECURITY_OAUTH2_ENABLED=${SECURITY_OAUTH2_ENABLED:-true}
      - SECURITY_OAUTH2_PROVIDER=${SECURITY_OAUTH2_PROVIDER:-sipetra}
      - SECURITY_OAUTH2_ISSUER=${SECURITY_OAUTH2_ISSUER:-https://bpsdemak.com}
      - SECURITY_OAUTH2_CLIENTID=${SECURITY_OAUTH2_CLIENTID:-019fca70-defd-73c4-b5d5-f2ac581a0792}
      - SECURITY_OAUTH2_CLIENTSECRET=${SECURITY_OAUTH2_CLIENTSECRET:-Efg9peKx0CFqxC9SgvZI5hqNMdyOgV8MktRo9bSw}
      - SECURITY_OAUTH2_AUTHORIZATIONURI=${SECURITY_OAUTH2_AUTHORIZATIONURI:-https://bpsdemak.com/oauth/authorize}
      - SECURITY_OAUTH2_TOKENURI=${SECURITY_OAUTH2_TOKENURI:-https://bpsdemak.com/oauth/token}
      - SECURITY_OAUTH2_USERINFOURI=${SECURITY_OAUTH2_USERINFOURI:-https://bpsdemak.com/api/user}
      - SECURITY_OAUTH2_REDIRECTURI=${SECURITY_OAUTH2_REDIRECTURI:-{baseUrl}/auth/sipetra/callback}
      - SECURITY_OAUTH2_SCOPES=${SECURITY_OAUTH2_SCOPES:-identity_pegawai:read, employee:read, contact:read, roles:read}
      - SECURITY_OAUTH2_USEASUSERNAME=${SECURITY_OAUTH2_USEASUSERNAME:-email}
      - SECURITY_OAUTH2_AUTOCREATEUSER=${SECURITY_OAUTH2_AUTOCREATEUSER:-true}
      - SECURITY_OAUTH2_BLOCKREGISTRATION=${SECURITY_OAUTH2_BLOCKREGISTRATION:-false}

      # Pengaturan Bahasa, Nama & Tema Aplikasi
      - SYSTEM_DEFAULTLOCALE=${LOCALE:-id_ID}
      - UI_APPNAME=${APP_NAME:-PDF Tools}
      - SYSTEM_DEFAULTTHEME=${SYSTEM_DEFAULTTHEME:-light}
      
      # Performa & Resource Tuning
      - JAVA_TOOL_OPTIONS=-Xmx1024m
    volumes:
      - ./trainingData:/usr/share/tessdata
      - ./extraConfigs:/configs
      - ./customFiles:/customFiles
      - ./pipeline:/pipeline
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
