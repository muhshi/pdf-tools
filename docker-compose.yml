version: '3.8'

services:
  pdf-tools:
    image: stirlingtools/stirling-pdf:latest
    container_name: pdf-tools
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Keamanan Login
      - SECURITY_ENABLELOGIN=${SECURITY_ENABLELOGIN:-true}
      - SECURITY_INITIALLOGIN_USERNAME=${ADMIN_USERNAME:-admin}
      - SECURITY_INITIALLOGIN_PASSWORD=${ADMIN_PASSWORD:-StirlingPassword123!}
      
      # Pengaturan Bahasa & Aplikasi
      - SYSTEM_DEFAULTLOCALE=${LOCALE:-id_ID}
      - UI_APPNAME=${APP_NAME:-PDF Tools}
      
      # Performa & Resource Tuning
      - JAVA_TOOL_OPTIONS=-Xmx1024m
    volumes:
      - ./trainingData:/usr/share/tessdata
      - ./extraConfigs:/configs
      - ./customFiles:/customFiles
      - ./pipeline:/pipeline
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
